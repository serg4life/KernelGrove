# Builds the Windows executable and installer.
#
# PyInstaller does not cross-compile and a Windows container needs a Windows
# host, so this is the project's Windows machine. It does not run on every
# push: it is ~200 MB of artifact and only needed when publishing.
#
# The dtc/cpp URLs come from the repository secrets; without them the
# installer still builds and ships without that optional component (see
# packaging/windows/README.md).
name: Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# To attach the installer to the tag's release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging]"

      - name: Ejecutable
        run: .\packaging\windows\build.ps1

      - name: Instalador
        # ISCC.exe comes with GitHub's image; if it ever stops doing so, the
        # script says so and `choco install innosetup -y` gets added here.
        env:
          KERNELGROVE_TOOLS_DTC_URL: ${{ secrets.KERNELGROVE_TOOLS_DTC_URL }}
          KERNELGROVE_TOOLS_DTC_SHA256: ${{ secrets.KERNELGROVE_TOOLS_DTC_SHA256 }}
          KERNELGROVE_TOOLS_CPP_URL: ${{ secrets.KERNELGROVE_TOOLS_CPP_URL }}
          KERNELGROVE_TOOLS_CPP_SHA256: ${{ secrets.KERNELGROVE_TOOLS_CPP_SHA256 }}
        run: .\packaging\windows\build_installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: kernelgrove-windows
          path: dist/kernelgrove-*-win64-setup.exe

      - name: Adjuntar a la release
        # With a `v*` tag the installer goes to that tag's release, in this
        # same repository. If `scripts/publish_release.sh` has not created it
        # yet, it is created here **as a draft**: published, it would become
        # «latest» without a `manifest.json`, and installed copies looking for
        # the database at `releases/latest/download/manifest.json` would not
        # find it. `publish_release.sh` publishes it once the manifest is up.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" -t "$TAG" --notes "" --draft
          gh release upload "$TAG" --clobber dist/kernelgrove-*-win64-setup.exe
