# Lint and tests on every push and every pull request.
#
# There is no database in CI (`database/bindings.db` is not versioned: it is
# 70 MB derived from a kernel checkout), so the tests that need it skip
# themselves — each of them is written for that. What does run in full is the
# semantic engine, which does not touch SQLite by design.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Librerías nativas de Qt
        # PySide6 links against EGL even with the `offscreen` backend, and
        # GitHub's image does not ship it: without this, importing PySide6 fails.
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # The `ingest` extra (pyyaml, dtschema) is build-time only for the app,
          # but the ingestion tests import `db_manager`, which needs it.
          pip install -e '.[ingest]'
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Pruebas
        # No display: the same mode the GUI can be used in inside a
        # container.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
